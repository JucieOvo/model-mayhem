<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>balance/next - 数值社区分支预览</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0f1315;
  --panel: #151b1e;
  --panel-strong: #1b2326;
  --line: #2a3538;
  --line-strong: #3b484c;
  --text: #edf3f1;
  --muted: #98a7a3;
  --accent: #5fc6b2;
  --accent-soft: rgba(95, 198, 178, 0.14);
  --amber: #d8a85f;
  --danger: #e58f83;
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
}
* {
  box-sizing: border-box;
}
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
}
button,
input {
  font: inherit;
}
body {
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--line);
  background: #121719;
}
.identity h1 {
  margin: 2px 0 0;
  font-size: 24px;
  line-height: 1.2;
}
.identity p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
}
.eyebrow {
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.branch-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}
.meta-pill {
  padding: 6px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: #121719;
}
.search {
  display: grid;
  grid-template-columns: auto minmax(220px, 360px);
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
}
.search input {
  width: 100%;
  min-width: 0;
  padding: 9px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  outline: none;
  background: #0d1113;
  color: var(--text);
}
.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
.filters {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  gap: 7px;
}
.filter {
  padding: 7px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.filter:hover,
.filter.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--text);
}
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 410px);
  min-height: 0;
}
.list-panel,
.detail-panel {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.list-panel {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  border-right: 1px solid var(--line);
}
.list-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
}
.list-heading strong {
  margin-right: 8px;
  color: var(--text);
}
.fingerprint {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.record-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  align-content: start;
  gap: 12px;
  min-height: 0;
  padding: 16px 20px 28px;
  overflow: auto;
}
.record-card {
  display: grid;
  grid-template-rows: auto auto minmax(48px, auto) auto;
  gap: 9px;
  min-height: 190px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.record-card:hover,
.record-card.selected {
  border-color: var(--accent);
  background: var(--panel-strong);
}
.record-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.card-topline,
.card-bottomline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}
.kind {
  color: var(--accent);
  font-weight: 700;
}
.record-card h3 {
  margin: 0;
  font-size: 17px;
  line-height: 1.3;
  word-break: break-word;
}
.record-card p {
  display: -webkit-box;
  margin: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}
.mini-fields {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.mini-field,
.chip {
  padding: 3px 7px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--muted);
  font-size: 11px;
}
.thumbnail {
  width: 100%;
  aspect-ratio: 16 / 7;
  object-fit: cover;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #0c1012;
}
.detail-panel {
  padding: 20px 22px 32px;
  overflow: auto;
  background: #111719;
}
.detail-header {
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.detail-header h2 {
  margin: 7px 0 0;
  font-size: 25px;
  line-height: 1.25;
  word-break: break-word;
}
.detail-header p {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}
.detail-thumbnail {
  width: 100%;
  max-height: 230px;
  margin-top: 15px;
  object-fit: cover;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.fact {
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
}
.fact dt {
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11px;
}
.fact dd {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  word-break: break-word;
}
.detail-section {
  margin-top: 22px;
}
.detail-section h3 {
  margin: 0 0 10px;
  color: var(--amber);
  font-size: 14px;
}
.detail-section p,
.detail-section li {
  color: #c8d2cf;
  font-size: 14px;
  line-height: 1.7;
}
.detail-section p {
  margin: 0 0 8px;
}
.detail-section ul {
  margin: 0;
  padding-left: 20px;
}
.effects {
  display: grid;
  gap: 8px;
}
.effect {
  padding: 9px 10px;
  border-left: 3px solid var(--accent);
  background: var(--panel);
  color: #c8d2cf;
  font-size: 13px;
  line-height: 1.55;
}
.option {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 9px;
  margin-bottom: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
}
.option.correct {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.option-id {
  color: var(--amber);
  font-weight: 700;
  text-transform: uppercase;
}
.empty {
  display: grid;
  min-height: 180px;
  place-items: center;
  color: var(--muted);
  text-align: center;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
@media (max-width: 1050px) {
  .layout {
    grid-template-columns: minmax(0, 1fr) 350px;
  }
  .record-grid {
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
}
@media (max-width: 780px) {
  body {
    overflow: auto;
  }
  .topbar,
  .toolbar {
    align-items: flex-start;
    flex-direction: column;
  }
  .branch-meta {
    justify-content: flex-start;
  }
  .search {
    grid-template-columns: 1fr;
    width: 100%;
  }
  .layout {
    grid-template-columns: 1fr;
    overflow: visible;
  }
  .list-panel {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .record-grid,
  .detail-panel {
    overflow: visible;
  }
}
</style>
</head>

  <script>
(() => {
  const payload = JSON.parse(document.getElementById("preview-data").textContent);
  const meta = payload.meta;
  const records = payload.records;
  const state = { kind: "all", query: "", selectedId: null };
  const grid = document.getElementById("grid");
  const detail = document.getElementById("detail");
  const filters = document.getElementById("filters");
  const search = document.getElementById("search");
  const visibleCount = document.getElementById("visible-count");
  const listTitle = document.getElementById("list-title");
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const role = document.getElementById("role");
  const branchMeta = document.getElementById("branch-meta");
  const fingerprint = document.getElementById("fingerprint");

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) {
      node.className = className;
    }
    if (text !== undefined && text !== null) {
      node.textContent = String(text);
    }
    return node;
  }

  function pill(text) {
    return element("span", "meta-pill", text);
  }

  function matches(record) {
    if (state.kind !== "all" && record.kind !== state.kind) {
      return false;
    }
    if (!state.query) {
      return true;
    }
    const haystack = [
      record.id,
      record.name,
      record.kindLabel,
      record.summary,
      record.path,
      ...(record.chips || []),
      ...(record.fields || []).flatMap((item) => [item.label, item.value]),
      ...(record.sections || []).flatMap((section) =>
        [
          section.title,
          ...(section.paragraphs || []),
          ...(section.items || []),
          ...(section.effects || []),
          ...(section.options || []).flatMap((option) => [option.id, option.text]),
          ...(section.facts || []).flatMap((item) => [item.label, item.value]),
        ].filter(Boolean),
      ),
    ]
      .join(" ")
      .toLocaleLowerCase();
    return haystack.includes(state.query.toLocaleLowerCase());
  }

  function renderFilters() {
    filters.replaceChildren();
    const counts = new Map();
    for (const record of records) {
      counts.set(record.kind, (counts.get(record.kind) || 0) + 1);
    }
    const entries = [["all", "全部", records.length], ...counts.entries()].map(
      ([kind, count]) => {
        const label =
          kind === "all"
            ? "全部"
            : records.find((record) => record.kind === kind)?.kindLabel || kind;
        return [kind, label, count];
      },
    );
    for (const [kind, label, count] of entries) {
      const button = element("button", "filter", label + " " + count);
      button.type = "button";
      button.classList.toggle("active", state.kind === kind);
      button.addEventListener("click", () => {
        state.kind = kind;
        renderFilters();
        renderGrid();
      });
      filters.append(button);
    }
  }

  function renderMiniFields(record) {
    const row = element("div", "mini-fields");
    for (const item of (record.fields || []).slice(0, 4)) {
      row.append(element("span", "mini-field", item.label + " " + item.value));
    }
    return row;
  }

  function renderCard(record) {
    const button = element("button", "record-card");
    button.type = "button";
    button.dataset.recordId = record.id;
    button.classList.toggle("selected", state.selectedId === record.id);
    if (record.thumbnail) {
      const image = element("img", "thumbnail");
      image.src = record.thumbnail;
      image.alt = record.name;
      image.loading = "lazy";
      button.append(image);
    }
    const top = element("div", "card-topline");
    top.append(element("span", "kind", record.kindLabel), element("span", "", record.id));
    button.append(top);
    button.append(element("h3", "", record.name));
    button.append(element("p", "", record.summary));
    const bottom = element("div", "card-bottomline");
    bottom.append(renderMiniFields(record));
    button.append(bottom);
    button.addEventListener("click", () => selectRecord(record.id));
    return button;
  }

  function renderFact(item) {
    const wrapper = element("dl", "fact");
    wrapper.append(element("dt", "", item.label), element("dd", "", item.value));
    return wrapper;
  }

  function renderSection(section) {
    const wrapper = element("section", "detail-section");
    wrapper.append(element("h3", "", section.title));
    if (section.paragraphs) {
      for (const paragraph of section.paragraphs) {
        wrapper.append(element("p", "", paragraph));
      }
    }
    if (section.items) {
      const list = element("ul");
      for (const item of section.items) {
        list.append(element("li", "", item));
      }
      wrapper.append(list);
    }
    if (section.effects) {
      const effects = element("div", "effects");
      for (const effect of section.effects) {
        effects.append(element("div", "effect", effect));
      }
      wrapper.append(effects);
    }
    if (section.options) {
      for (const option of section.options) {
        const row = element("div", "option" + (option.correct ? " correct" : ""));
        row.append(element("span", "option-id", option.id), element("span", "", option.text));
        wrapper.append(row);
      }
    }
    if (section.facts) {
      const facts = element("div", "detail-grid");
      for (const item of section.facts) {
        facts.append(renderFact(item));
      }
      wrapper.append(facts);
    }
    return wrapper;
  }

  function renderDetail(record) {
    detail.replaceChildren();
    if (!record) {
      detail.append(element("div", "empty", "选择一条记录查看完整信息。"));
      return;
    }
    const header = element("header", "detail-header");
    header.append(element("div", "eyebrow", record.kindLabel + " / " + record.id));
    header.append(element("h2", "", record.name));
    if (record.summary) {
      header.append(element("p", "", record.summary));
    }
    detail.append(header);
    if (record.thumbnail) {
      const image = element("img", "detail-thumbnail");
      image.src = record.thumbnail;
      image.alt = record.name;
      detail.append(image);
    }
    if (record.chips && record.chips.length > 0) {
      const chips = element("div", "chips");
      for (const chip of record.chips) {
        chips.append(element("span", "chip", chip));
      }
      detail.append(chips);
    }
    if (record.fields && record.fields.length > 0) {
      const facts = element("div", "detail-grid");
      for (const item of record.fields) {
        facts.append(renderFact(item));
      }
      detail.append(facts);
    }
    for (const section of record.sections || []) {
      detail.append(renderSection(section));
    }
  }

  function selectRecord(id) {
    state.selectedId = id;
    for (const card of grid.querySelectorAll(".record-card")) {
      card.classList.toggle("selected", card.dataset.recordId === id);
    }
    renderDetail(records.find((record) => record.id === id) || null);
    history.replaceState(null, "", "#" + encodeURIComponent(id));
  }

  function renderGrid() {
    const filtered = records.filter(matches);
    grid.replaceChildren();
    visibleCount.textContent = "显示 " + filtered.length + " / " + records.length;
    listTitle.textContent = state.kind === "all" ? "全部条目" : "筛选条目";
    if (filtered.length === 0) {
      grid.append(element("div", "empty", "没有匹配当前条件的记录。"));
      renderDetail(null);
      return;
    }
    for (const record of filtered) {
      grid.append(renderCard(record));
    }
    const selectedVisible = filtered.some((record) => record.id === state.selectedId);
    if (!selectedVisible) {
      state.selectedId = filtered[0].id;
    }
    selectRecord(state.selectedId);
  }

  title.textContent = meta.title;
  subtitle.textContent = meta.subtitle;
  role.textContent = meta.branch + " / " + meta.status;
  branchMeta.append(
    pill("版本 " + meta.version),
    pill("规则 " + meta.rulesetVersion),
    pill("条目 " + meta.recordCount),
  );
  if (meta.promotesTo) {
    branchMeta.append(pill("去向 " + meta.promotesTo));
  }
  fingerprint.textContent = "数据指纹 " + meta.fingerprint.slice(0, 16);

  search.addEventListener("input", () => {
    state.query = search.value.trim();
    renderGrid();
  });

  renderFilters();
  const initialId = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (initialId && records.some((record) => record.id === initialId)) {
    state.selectedId = initialId;
  }
  renderGrid();
})();
</script>
</body>
</html>
