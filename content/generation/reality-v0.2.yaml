organizationProfiles:
  - match: [基础设施, 计算, 云, GPU, 加速器, infrastructure]
    subtype: infrastructure
    computeCost: 0
    capitalCost: 5
    capitalIncome: 2
    capacity: 3
    openness: closed
    passive:
      kind: modify_compute_ceiling
      target: self
      amount: 1
    actionSet: infrastructure
  - match: [平台, 社区, 托管, 仓库, 运行, platform]
    subtype: platform
    computeCost: 1
    capitalCost: 3
    capitalIncome: 1
    capacity: 4
    openness: open_source
    passive:
      kind: modify_cost
      target: self
      resource: compute
      amount: -1
      durationRounds: 1
      selector:
        cardTypes: [asset]
        openness: [open_weights, open_source, open_science]
    actionSet: platform
  - match: [开放权重, 社区许可证, 开源, 本地]
